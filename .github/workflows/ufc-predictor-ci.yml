# Tests ufc-predictor/ on every push and pull request that touches it, on SQLite and on Postgres.
name: UFC Predictor CI

on:
  push:
    branches: [master]
    paths: ['ufc-predictor/**', '.github/workflows/ufc-predictor-ci.yml']
  pull_request:
    paths: ['ufc-predictor/**', '.github/workflows/ufc-predictor-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufc-predictor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ufcpred_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ufc-predictor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ufc-predictor/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (${{ matrix.backend }})
        env:
          UFCPRED_TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/ufcpred_test' || '' }}
        run: python -m pytest -q

# Long-running jobs for the Vercel deployment of nba-predictor/. A serverless request cannot refresh
# seventeen thousand games, fetch box scores, run backtests or replay seasons, so these run here against
# the same Postgres database (repository secret NBAPRED_DATABASE_URL).
name: NBA Predictor jobs

on:
  schedule:
    - cron: '17 */3 * * *'   # lifecycle tick: schedule + lines, predict, lock, results, grade, learn
    - cron: '47 4 * * 1'     # weekly backup (gzipped JSON export kept as an artifact)
  workflow_dispatch:
    inputs:
      command:
        description: Job to run
        type: choice
        options: [tick, refresh, bootstrap, probe, learn, backup, report, diagnose]
        default: tick
      replay_start:
        description: 'bootstrap only: first game date to replay (YYYY-MM-DD)'
        default: '2024-10-22'

permissions:
  contents: read

concurrency:
  group: nba-predictor-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: nba-predictor
    env:
      DATABASE_URL: ${{ secrets.NBAPRED_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      COMMAND: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 4 * * 1' && 'backup' || 'tick') || inputs.command }}
      REPLAY_START: ${{ inputs.replay_start }}
    steps:
      - name: Check configuration
        id: cfg
        working-directory: .        # runs before checkout, when nba-predictor/ does not exist yet
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::warning::NBAPRED_DATABASE_URL is not set; scheduled job skipped. See nba-predictor/README.md → Deploying to Vercel."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Add the repository secret NBAPRED_DATABASE_URL (Neon connection string) first."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nba-predictor/requirements-jobs.txt
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements-jobs.txt
      - name: Run ${{ env.COMMAND }}
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          case "$COMMAND" in
            tick)    python -m nbapred tick > tick.json; python -c "import json; d=json.load(open('tick.json')); print(json.dumps({k: d[k] for k in ('upcoming','locks','predictions')}, indent=2, default=str))" ;;
            refresh) python -m nbapred refresh ;;
            learn)   python -m nbapred learn --mode live ;;
            backup)  python -m nbapred backup ;;
            report)  python -m nbapred report --out report.md; cat report.md >> "$GITHUB_STEP_SUMMARY" ;;
            diagnose) pip install -q "httpx>=0.27"; python -m nbapred.diagnose ;;
            probe)   python -m nbapred probe-sources ;;
            bootstrap)
              [[ "$REPLAY_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::replay_start must be YYYY-MM-DD"; exit 1; }
              python -m nbapred refresh
              python -m nbapred refresh-boxes --limit 6000
              python -u -m nbapred replay --start "$REPLAY_START"
              python -m nbapred refresh-upcoming
              python -m nbapred report --out report.md; cat report.md >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::unknown command $COMMAND"; exit 1 ;;
          esac
      - if: steps.cfg.outputs.skip != 'true' && env.COMMAND == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: nbapred-backup-${{ github.run_id }}
          path: /tmp/nbapred/backups/
          retention-days: 90

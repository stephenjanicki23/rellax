name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [master, main, claude/sports-betting-edges-yr9mh8]
    paths: [betting/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push betting/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github"
          git config --global user.name "GitHub Actions"

          # Clone (or init) the Space repo
          REPO_URL="https://sjanicki23:${HF_TOKEN}@huggingface.co/spaces/sjanicki23/sports-betting-edges"
          if ! git clone --depth 1 "$REPO_URL" /tmp/hf_space 2>/dev/null; then
            mkdir -p /tmp/hf_space
            git -C /tmp/hf_space init
            git -C /tmp/hf_space remote add origin "$REPO_URL"
          fi

          # Sync betting/ into Space root (exclude dev-only files)
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='deploy.sh' \
            --exclude='tests/' \
            "$GITHUB_WORKSPACE/betting/" /tmp/hf_space/

          cd /tmp/hf_space
          git add -A
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Auto-deploy from GitHub Actions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin HEAD:main --force

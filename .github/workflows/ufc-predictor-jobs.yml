# Long-running jobs for the Vercel deployment of ufc-predictor/. A serverless request cannot
# refresh nine thousand fights, run backtests or replay two years of cards, so these run here
# against the same Postgres database (repository secret UFCPRED_DATABASE_URL).
name: UFC Predictor jobs

on:
  schedule:
    - cron: '23 */6 * * *'   # lifecycle tick: refresh data, predict, lock, grade, learn
    - cron: '41 3 * * 0'     # weekly backup (gzipped JSON export kept as an artifact)
  workflow_dispatch:
    inputs:
      command:
        description: Job to run
        type: choice
        options: [tick, refresh, bootstrap, learn, backup, report]
        default: tick
      replay_start:
        description: 'bootstrap only: first event date to replay (YYYY-MM-DD)'
        default: '2024-10-01'

permissions:
  contents: read

concurrency:
  group: ufc-predictor-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: ufc-predictor
    env:
      DATABASE_URL: ${{ secrets.UFCPRED_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      COMMAND: ${{ github.event_name == 'schedule' && (github.event.schedule == '41 3 * * 0' && 'backup' || 'tick') || inputs.command }}
      REPLAY_START: ${{ inputs.replay_start }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::warning::UFCPRED_DATABASE_URL is not set; scheduled job skipped. See ufc-predictor/README.md → Deploying to Vercel."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Add the repository secret UFCPRED_DATABASE_URL (Neon connection string) first."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ufc-predictor/requirements.txt
      - if: steps.cfg.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Run ${{ env.COMMAND }}
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          case "$COMMAND" in
            tick)    python -m ufcpred tick > tick.json; python -c "import json; d=json.load(open('tick.json')); print(json.dumps({k: d[k] for k in ('upcoming','locks','predictions')}, indent=2, default=str))" ;;
            refresh) python -m ufcpred refresh ;;
            learn)   python -m ufcpred learn --mode live ;;
            backup)  python -m ufcpred backup ;;
            report)  python -m ufcpred report --out report.md; cat report.md >> "$GITHUB_STEP_SUMMARY" ;;
            bootstrap)
              [[ "$REPLAY_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::replay_start must be YYYY-MM-DD"; exit 1; }
              python -m ufcpred refresh
              python -u -m ufcpred replay --start "$REPLAY_START"
              python -m ufcpred report --out report.md; cat report.md >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::unknown command $COMMAND"; exit 1 ;;
          esac
      - if: steps.cfg.outputs.skip != 'true' && env.COMMAND == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: ufcpred-backup-${{ github.run_id }}
          path: /tmp/ufcpred/backups/
          retention-days: 90

[project]
name = "ufcpred"
version = "0.1.0"
description = "Self-learning UFC fight card prediction engine"
requires-python = ">=3.11"
# Runtime dependencies (Vercel installs these). Keep in sync with requirements.txt.
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
analyst = ["anthropic"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
